<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Пользователь заблокирован</title>
  <style>
    :root {
      color-scheme: dark;
      --bg1: #0f172a;
      --bg2: #111827;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #8b5cf6;
      --danger: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.24), transparent 32%),
        radial-gradient(circle at 80% 15%, rgba(244, 63, 94, 0.18), transparent 28%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow-x: hidden;
    }

    .page {
      width: min(100%, 520px);
      text-align: center;
    }

    .card {
      position: relative;
      padding: 32px 26px;
      border: 1px solid var(--card-border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -1px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.22), transparent 38%, rgba(251, 113, 133, 0.18));
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .icon {
      width: 74px;
      height: 74px;
      display: inline-grid;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 24px;
      background: rgba(251, 113, 133, 0.12);
      border: 1px solid rgba(251, 113, 133, 0.24);
      color: var(--danger);
      font-size: 34px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 38px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    p {
      margin: 14px auto 0;
      max-width: 420px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 700;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 0 6px rgba(251, 113, 133, 0.12);
    }

    .footer {
      margin-top: 18px;
      color: rgba(203, 213, 225, 0.76);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Страница блокировки">
      <div class="content">
        <div class="icon" aria-hidden="true">!</div>
        <h1>Пользователь заблокирован</h1>
        <p>Доступ к этому разделу ограничен. Если блокировка была выдана временно, доступ восстановится после окончания срока блокировки.</p>
        <div class="status"><span class="dot" aria-hidden="true"></span> Доступ закрыт</div>
      </div>
    </section>
    <div class="footer">Страница уведомления о блокировке</div>
  </main>
</body>
</html>
